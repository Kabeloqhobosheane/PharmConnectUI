<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmConnect - Login & Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="container-fluid bg-cream">
    <div class="row justify-content-center">
      <!-- Left Section: Login -->
      <div class="col-md-6 col-lg-5">
        <div class="card">
          <div class="left-section">
            <div class="overlay"></div>
            <div class="content">
              <img src="logo.png" alt="PharmConnect Logo" class="logo mb-4">
              <h2 class="card-title mb-4">Sign In</h2>
              <form>
                <div class="mb-3">
                  <input type="email" class="form-control" placeholder="Email" required>
                </div>
                <div class="mb-3">
                  <input type="password" class="form-control" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign In</button>
              </form>
              <div class="social-media mt-4">
                <a href="#" class="social-icon bg-primary text-white"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="social-icon bg-info text-white"><i class="fab fa-twitter"></i></a>
                <a href="#" class="social-icon bg-success text-white"><i class="fab fa-whatsapp"></i></a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Section: Register -->
      <div class="col-md-6 col-lg-5">
        <div class="card">
          <div class="right-section">
            <div class="overlay"></div>
            <div class="content">
              <img src="logo.png" alt="PharmConnect Logo" class="logo mb-4">
              <h2 class="card-title mb-4">Sign Up</h2>
              <form>
                <div class="mb-3">
                  <input type="text" class="form-control" placeholder="Full Name" required>
                </div>
                <div class="mb-3">
                  <input type="email" class="form-control" placeholder="Email" required>
                </div>
                <div class="mb-3">
                  <input type="password" class="form-control" placeholder="Password" required>
                </div>
                <div class="mb-3">
                  <input type="password" class="form-control" placeholder="Confirm Password" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Sign Up</button>
              </form>
              <div class="social-media mt-4">
                <a href="#" class="social-icon bg-primary text-white"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="social-icon bg-info text-white"><i class="fab fa-twitter"></i></a>
                <a href="#" class="social-icon bg-success text-white"><i class="fab fa-whatsapp"></i></a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (for Pills functionality) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

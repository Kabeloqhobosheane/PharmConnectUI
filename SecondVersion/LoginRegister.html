<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmConnect - Login & Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="container-fluid vh-100 d-flex align-items-center">
    <div class="row w-100">
      
      <!-- Left Side: Text & Background Image -->
      <div class="col-md-7 left-section d-flex align-items-center text-white">
        <div class="overlay"></div>
        <div class="content p-5">
          <h1>Welcome to PharmConnect</h1>
          <p>Your one-stop platform for seamless pharmaceutical connections.</p>
          <p>Join us today and experience effortless medication management!</p>
        </div>
      </div>

      <!-- Right Side: Forms -->
      <div class="col-md-5 d-flex align-items-center justify-content-center">
        <div class="form-container">
          <!-- Pills Navigation -->
          <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab" aria-controls="pills-login" aria-selected="true">Sign In</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="pills-register-tab" data-bs-toggle="pill" data-bs-target="#pills-register" type="button" role="tab" aria-controls="pills-register" aria-selected="false">Sign Up</button>
            </li>
          </ul>

          <!-- Pills Content -->
          <div class="tab-content" id="pills-tabContent">
            <!-- Login Form -->
            <div class="tab-pane fade show active" id="pills-login" role="tabpanel" aria-labelledby="pills-login-tab">
              <div class="card">
                <div class="card-body text-center">
                  <img src="logo1.png" alt="PharmConnect Logo" class="logo mb-4">
                  <h2 class="card-title mb-4">Sign In</h2>
                  <form>
                    <div class="mb-3">
                      <input type="email" class="form-control" placeholder="Email" required>
                    </div>
                    <div class="mb-3">
                      <input type="password" class="form-control" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Sign In</button>
                  </form>
                </div>
              </div>
            </div>

            <!-- Register Form -->
            <div class="tab-pane fade" id="pills-register" role="tabpanel" aria-labelledby="pills-register-tab">
              <div class="card">
                <div class="card-body text-center">
                  <img src="logo1.png" alt="PharmConnect Logo" class="logo mb-4">
                  <h2 class="card-title mb-4">Sign Up</h2>
                  <form>
                    <div class="mb-3">
                      <input type="text" class="form-control" placeholder="Full Name" required>
                    </div>
                    <div class="mb-3">
                      <input type="email" class="form-control" placeholder="Email" required>
                    </div>
                    <div class="mb-3">
                      <input type="password" class="form-control" placeholder="Password" required>
                    </div>
                    <div class="mb-3">
                      <input type="password" class="form-control" placeholder="Confirm Password" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Sign Up</button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS (for Pills functionality) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmConnect - Add Medication</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <!-- Medication Add Form -->
        <div class="card mt-5">
          <div class="card-body">
            <h2 class="card-title text-center mb-4">Add Medication</h2>
            <form>
              <!-- Medication Name -->
              <div class="mb-3">
                <label for="medicationName" class="form-label">Medication Name</label>
                <input type="text" class="form-control" id="medicationName" placeholder="Enter medication name" required>
              </div>

              <!-- Dosage -->
              <div class="mb-3">
                <label for="dosage" class="form-label">Dosage</label>
                <input type="text" class="form-control" id="dosage" placeholder="Enter dosage (e.g., 500mg)" required>
              </div>

              <!-- Quantity -->
              <div class="mb-3">
                <label for="quantity" class="form-label">Quantity</label>
                <input type="number" class="form-control" id="quantity" placeholder="Enter quantity" required>
              </div>

              <!-- Price -->
              <div class="mb-3">
                <label for="price" class="form-label">Price</label>
                <div class="input-group">
                  <span class="input-group-text">$</span>
                  <input type="number" class="form-control" id="price" placeholder="Enter price" step="0.01" required>
                </div>
              </div>

              <!-- Expiration Date -->
              <div class="mb-3">
                <label for="expirationDate" class="form-label">Expiration Date</label>
                <input type="date" class="form-control" id="expirationDate" required>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="btn btn-primary w-100">
                <i class="fas fa-plus-circle"></i> Add Medication
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
